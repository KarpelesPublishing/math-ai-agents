<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Constructed release console</title>
<style>body{font:18px Georgia,serif;max-width:850px;margin:40px auto;padding:0 20px;color:#222}button{font:inherit;padding:8px;margin:6px}section{border:1px solid #333;padding:15px;margin:15px 0}pre{white-space:pre-wrap;font:15px monospace}label{display:block;margin:15px 0}</style>
<h1>When an action has coordinates</h1>
<p>This local teaching example contains two fictitious records. Only v2 has approval. The saved observation initially places v2 in the upper row. No external document is released.</p>
<section><h2>Current layout</h2><div id="rows"></div></section>
<p id="observation"></p>
<label><input type="checkbox" id="mediated" checked> Check current permission before every effect</label>
<button id="swap">Swap current rows</button><button id="refresh">Refresh observation</button>
<button id="coordinate">Replay saved coordinate</button><button id="semantic">Request v2 by identifier</button>
<button id="transaction">Request v2 with saved state version</button>
<h2>Event record</h2><pre id="record">No command yet.</pre>
<script>
let current=['v2','v3'], observed=[...current], version=1, observedVersion=1;
function render(){document.getElementById('rows').textContent=current.map((d,i)=>`${i+1}. ${d}: ${d==='v2'?'approved':'not approved'}`).join(' | ');document.getElementById('observation').textContent=`Saved observation: ${observed.join(', ')}; state version ${observedVersion}. Current state version ${version}.`;}
function act(mode){let target=mode==='coordinate'?current[observed.indexOf('v2')]:'v2';let denied=(mode==='transactional'&&version!==observedVersion)||(document.getElementById('mediated').checked&&target!=='v2');document.getElementById('record').textContent=JSON.stringify({interface:mode,intended:'v2',reached:target,outcome:denied?'denied':'confirmed',effect:denied?null:target,authorized_completion:!denied&&target==='v2',unauthorized_effect:!denied&&target!=='v2'},null,2);}
document.getElementById('swap').onclick=()=>{current.reverse();version++;render();};
document.getElementById('refresh').onclick=()=>{observed=[...current];observedVersion=version;render();};
document.getElementById('coordinate').onclick=()=>act('coordinate');
document.getElementById('semantic').onclick=()=>act('semantic');
document.getElementById('transaction').onclick=()=>act('transactional');
render();
</script></html>
